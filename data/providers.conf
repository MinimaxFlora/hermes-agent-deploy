# hermes-vps 模型提供商表(数据驱动)
# 格式: id|显示名|密钥环境变量|示例模型|base_url|api_mode|说明
#   id            —— 写入 model.provider 的值(Hermes 官方 provider id)
#   env_key       —— 密钥写入 $HERMES_HOME/.env 的变量名
#   示例模型      —— 官方文档示例,填错可直接改;留空表示由用户自行填写
#   base_url      —— 留空表示用官方默认端点;自定义端点才需要
#   api_mode      —— 留空自动探测;可选 chat_completions / codex_responses / anthropic_messages
# 官方 provider 列表: https://hermes-agent.nousresearch.com/docs/integrations/providers
# 新增一个提供商 = 在这里加一行,不需要改任何脚本。

# ---- 国产优先(国内 VPS 直连友好) ----
deepseek|DeepSeek 官方|DEEPSEEK_API_KEY|deepseek-chat|||性价比高,国内直连
zai|智谱 GLM (z.ai)|GLM_API_KEY|glm-5|||GLM 系列,文档示例模型 glm-5
kimi-coding-cn|Kimi 月之暗面(国内站)|KIMI_CN_API_KEY|kimi-k2.5|||api.moonshot.cn
alibaba|阿里云百炼 DashScope|DASHSCOPE_API_KEY|qwen3.5-plus|||Qwen 系列
alibaba-cn|阿里云百炼(国内端点)|DASHSCOPE_API_KEY|qwen3.5-plus|||大陆端点
alibaba-coding-plan|阿里云 Coding Plan|ALIBABA_CODING_PLAN_API_KEY|qwen3-coder-plus|||固定套餐计费
minimax-cn|MiniMax(中国端点)|MINIMAX_CN_API_KEY|MiniMax-M2.7|||MiniMax 系列
tencent-tokenhub|腾讯 TokenHub|TOKENHUB_API_KEY|hy4-preview|||腾讯混元系列
xiaomi|小米 MiMo|XIAOMI_API_KEY|mimo-v2-pro|||MiMo 系列
stepfun|阶跃星辰 StepFun|STEPFUN_API_KEY||||OpenAI 兼容

# ---- 国际聚合 / 直连 ----
openrouter|OpenRouter 聚合|OPENROUTER_API_KEY|anthropic/claude-sonnet-4.6|||一个 key 走 400+ 模型,最省事
anthropic|Anthropic 官方|ANTHROPIC_API_KEY|claude-sonnet-4-6|||Claude 系列
openai-api|OpenAI 官方|OPENAI_API_KEY|gpt-5.4|||可用 OPENAI_BASE_URL 覆盖端点
gemini|Google Gemini|GEMINI_API_KEY||||API Key 方式
xai|xAI Grok|XAI_API_KEY|grok-4-fast-reasoning|||走 Responses API
novita|NovitaAI|NOVITA_API_KEY|moonshotai/kimi-k2.5|||200+ 模型
deepinfra|DeepInfra|DEEPINFRA_API_KEY||||按目录实时发现
fireworks|Fireworks AI|FIREWORKS_API_KEY|accounts/fireworks/models/kimi-k2p6|||原生 slash 形式模型 ID
nvidia|NVIDIA Build|NVIDIA_API_KEY||||NIM 托管模型
huggingface|Hugging Face|HF_TOKEN|Qwen/Qwen3.5-397B-A17B|||路由到 20+ 开源模型
kimi-coding|Kimi(国际站)|KIMI_API_KEY|kimi-for-coding|||api.moonshot.ai
minimax|MiniMax(国际端点)|MINIMAX_API_KEY|MiniMax-M2.7|||MiniMax 系列
gmi|GMI Cloud|GMI_API_KEY|zai-org/GLM-5.1-FP8|||用 /v1/models 返回的真实 ID

