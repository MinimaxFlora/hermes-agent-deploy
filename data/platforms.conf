# hermes-vps 消息平台表(数据驱动)
# 格式: id|显示名|mode|必需变量(逗号分隔)|可选变量(逗号分隔)|说明
#   id      —— Hermes 平台 id,同时写入 platforms.<id>.enabled
#   mode    —— env   = 只要填密钥即可跑
#              meter = 需要额外公网参数(webhook/回调)
#              qr    = 需要交互式登录(扫码/OAuth),由 hermes gateway setup 完成
#   必需/可选变量 —— 全部写入 $HERMES_HOME/.env
# 新增平台 = 加一行。官方平台文档: https://hermes-agent.nousresearch.com/docs/user-guide/messaging
# 注意:微信分两种 —— weixin(个人微信,iLink 扫码)与 wecom(企业微信)。

# ---- 国内常用 ----
qqbot|QQ 机器人(官方 API v2)|env|QQ_APP_ID,QQ_CLIENT_SECRET|QQBOT_HOME_CHANNEL,QQ_ALLOWED_USERS,QQ_GROUP_ALLOWED_USERS,QQ_PORTAL_HOST,QQ_STT_API_KEY|q.qq.com 建应用;支持私聊/群@/频道
weixin|个人微信(iLink 扫码登录)|qr|WEIXIN_ACCOUNT_ID|WEIXIN_TOKEN,WEIXIN_DM_POLICY,WEIXIN_ALLOWED_USERS,WEIXIN_HOME_CHANNEL|长轮询,不需要公网 webhook;首次要扫码
wecom|企业微信 AI 机器人|env|WECOM_BOT_ID,WECOM_SECRET|WECOM_DM_POLICY,WECOM_GROUP_POLICY,WECOM_ALLOWED_USERS,WECOM_HOME_CHANNEL|WebSocket 网关接入
feishu|飞书 / Lark|meter|FEISHU_APP_ID,FEISHU_APP_SECRET|FEISHU_VERIFICATION_TOKEN,FEISHU_ENCRYPT_KEY,FEISHU_CONNECTION_MODE,FEISHU_DOMAIN,FEISHU_ALLOWED_USERS,FEISHU_HOME_CHANNEL|默认长连接模式;webhook 模式需回调地址
dingtalk|钉钉机器人|env|DINGTALK_CLIENT_ID,DINGTALK_CLIENT_SECRET|DINGTALK_ALLOWED_USERS,DINGTALK_REQUIRE_MENTION,DINGTALK_HOME_CHANNEL|Stream 模式接入
yuanbao|腾讯元宝企业版|env|||WebSocket 网关接入(见官方文档)

# ---- 国际常用 ----
telegram|Telegram|env|TELEGRAM_BOT_TOKEN|TELEGRAM_ALLOWED_USERS,TELEGRAM_HOME_CHANNEL,TELEGRAM_PROXY,TELEGRAM_ALLOW_BOTS|@BotFather 建机器人
discord|Discord|env|DISCORD_BOT_TOKEN|DISCORD_ALLOWED_USERS,DISCORD_HOME_CHANNEL,DISCORD_REQUIRE_MENTION|开发者后台建应用
slack|Slack|env|SLACK_BOT_TOKEN,SLACK_APP_TOKEN|SLACK_ALLOWED_USERS,SLACK_HOME_CHANNEL|Socket Mode
whatsapp|WhatsApp|qr|WHATSAPP_ENABLED|WHATSAPP_ALLOWED_USERS,WHATSAPP_MODE,WHATSAPP_GROUP_POLICY|内置 Baileys 桥,扫码登录
signal|Signal|meter|SIGNAL_ACCOUNT|SIGNAL_HTTP_URL,SIGNAL_ALLOWED_USERS,SIGNAL_HOME_CHANNEL|需要 signal-cli 守护进程
matrix|Matrix|env|MATRIX_HOMESERVER,MATRIX_USER_ID,MATRIX_ACCESS_TOKEN|MATRIX_ALLOWED_USERS,MATRIX_HOME_ROOM,MATRIX_ENCRYPTION|自建/托管 homeserver
email|邮件助手|env|EMAIL_ADDRESS,EMAIL_PASSWORD,EMAIL_IMAP_HOST,EMAIL_SMTP_HOST|EMAIL_IMAP_PORT,EMAIL_SMTP_PORT,EMAIL_ALLOWED_USERS,EMAIL_HOME_ADDRESS|IMAP + SMTP
api_server|OpenAI 兼容 API(给第三方客户端用)|env|API_SERVER_KEY|API_SERVER_HOST,API_SERVER_PORT,API_SERVER_CORS_ORIGINS|供 OpenWebUI / LobeChat / 脚本调用
