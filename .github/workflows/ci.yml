name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 caddy(用于配置校验与路由测试)
        run: |
          set -euo pipefail
          curl -fsSL "https://caddyserver.com/api/download?os=linux&arch=amd64" -o /tmp/caddy
          sudo install -m 755 /tmp/caddy /usr/local/bin/caddy
          caddy version

      - name: 静态检查 lint
        run: bash tests/lint.sh

      - name: 冒烟测试 smoke
        run: bash tests/smoke.sh

      - name: 安装器版本解析回归(离线,假 curl)
        run: bash tests/installer-resolve.sh

      - name: 严格模式回归 strict
        run: bash tests/strict.sh

      - name: Caddyfile 校验(真实 caddy)
        run: bash tests/caddyfile-validate.sh

      - name: 路由行为测试(真实 caddy + 假上游)
        run: bash tests/caddy-routing.sh

      - name: 构建发布用单文件
        run: bash build.sh dist/hermes-vps.sh

      - name: 安装器自检(管道形式 / 参数解析 / 下载校验)
        run: |
          set -euo pipefail
          bash -n install.sh
          # 历史上 usage() 用 sed "$0" 取注释:管道安装时 $0=bash → 直接报错退出
          cat install.sh | bash -s -- --help | grep -q 'bash -s -- --check'
          if cat install.sh | bash -s -- --nope >/dev/null 2>&1; then
            echo "✘ 未知参数未被拒绝"; exit 1
          fi
          # 端到端 A(严格):钉一个已存在的旧版本,必须完整走完"下载 → sha256 校验"
          #   钉版本是为了不和 release 构建抢跑(打 tag 时新资产可能还在上传,latest 会 404)
          if ! out2="$(cat install.sh | bash -s -- --version v1.0.0 --dry-run 2>&1)"; then
            printf '%s\n' "$out2" | tail -4
            echo "✘ 固定版本 v1.0.0 的 dry-run 失败"; exit 1
          fi
          printf '%s\n' "$out2" | tail -2

          # 端到端 B(最新版):下载+校验;若恰好撞上"新 Release 正在上传/限流"则只记录不算失败
          out=""; st=0
          out="$(cat install.sh | bash -s -- --dry-run 2>&1)" || st=$?
          printf '%s\n' "$out" | tail -4
          if printf '%s' "$out" | grep -qE '下载到的文件为空|不是合法 bash 脚本|校验失败'; then
            echo "✘ dry-run 在下载/校验环节失败"; exit 1
          fi
          if [[ $st -ne 0 ]]; then
            if printf '%s' "$out" | grep -qE '无法获取最新版本|rate limit|速率|API rate|还没构建完成'; then
              echo "· latest 暂时取不到(限流或资产还在上传),已由上面的钉版本断言覆盖"
            else
              echo "✘ dry-run 因非竞态原因失败"; exit 1
            fi
          fi
          echo "✔ 安装器自检通过"

      - name: 运行模式自检(非 root 自动走用户态;可由 HV_FORCE_MODE 覆盖)
        run: |
          set -euo pipefail
          # CI 是普通用户:应自动识别为用户态,路径全部落在 $HOME,不碰 /etc、/var
          out="$(bash dist/hermes-vps.sh mode)"
          echo "$out"
          grep -q '用户态' <<<"$out"
          grep -q "$HOME" <<<"$out"
          # 强制系统级时应解析成系统路径(root 环境下的行为)
          sysout="$(HV_FORCE_MODE=system bash dist/hermes-vps.sh mode)"
          echo "$sysout"
          grep -q '/etc/hermes-vps' <<<"$sysout"
          bash dist/hermes-vps.sh version >/dev/null
          bash dist/hermes-vps.sh selftest >/dev/null
          echo "✔ 双模式路径解析正确;version/selftest 正常"

      - name: 产物自检(输出保持可见,便于定位 CI 环境差异)
        run: |
          set -euo pipefail
          bash -n dist/hermes-vps.sh
          bash dist/hermes-vps.sh version
          bash dist/hermes-vps.sh selftest
          sha256sum dist/hermes-vps.sh | tee dist/hermes-vps.sh.sha256

      - name: 上传产物(供人工检查)
        uses: actions/upload-artifact@v4
        with:
          name: hermes-vps.sh
          path: dist/hermes-vps.sh
          if-no-files-found: error
